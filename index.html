<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PKD Learning Hub – M.Sc. Dialysis Technology</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f8fb;--card:#fff;--tx:#17324d;--mu:#5b7288;--bd:#d8e4ee;--pr:#0b7a75;--ac:#7c3aed}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1b26;--card:#18293a;--tx:#e6f0f8;--mu:#9bb2c6;--bd:#2a4157}}
:root[data-theme=dark]{--bg:#0f1b26;--card:#18293a;--tx:#e6f0f8;--mu:#9bb2c6;--bd:#2a4157}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(120deg,#0b7a75,#2563eb,#7c3aed);color:#fff;padding:28px 18px 22px;text-align:center}
header h1{margin:0;font-size:1.7rem}header p{margin:6px 0 0;opacity:.92}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:6px;padding:8px;overflow-x:auto}
nav button{border:0;border-radius:99px;padding:8px 16px;background:var(--bg);color:var(--tx);font:600 14px inherit;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--pr);color:#fff}
main{max-width:900px;margin:0 auto;padding:14px}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:18px;margin:0 0 18px;overflow:hidden}
.ban{height:110px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#fff}
.ban h2{margin:0;font-size:1.35rem}.ban span{font-size:3.4rem}
.bd{padding:14px 18px 18px}.bd h3{color:var(--pr);margin:14px 0 4px}
.bd img{max-width:100%;border-radius:12px;display:block;margin:10px auto}
figcaption{font-size:.85rem;color:var(--mu);text-align:center}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.k{border-radius:14px;padding:12px;color:#fff}.k b{display:block;font-size:1.5rem}
table{width:100%;border-collapse:collapse;font-size:.9rem;display:block;overflow-x:auto}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left}th{background:var(--pr);color:#fff}
.fl{display:flex;flex-direction:column;align-items:center;gap:0}
.fb{width:min(100%,520px);padding:10px 14px;border-radius:12px;color:#fff;text-align:center;font-size:.92rem}
.ar{font-size:1.3rem;color:var(--ac);line-height:1.2}
.row{display:flex;gap:8px;width:min(100%,520px)}.row .fb{flex:1;width:auto}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:2px 10px;margin:2px;font-size:.85rem}
.btn{border:0;border-radius:10px;padding:9px 16px;background:var(--ac);color:#fff;font:600 14px inherit;cursor:pointer;margin:3px}.btn.s{background:var(--pr)}.btn.d{background:#dc2626}
input,textarea,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
.it{border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0;background:var(--card)}
.q{border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}.q label{display:block;padding:6px 8px;border-radius:8px;cursor:pointer}
.ok{background:#16a34a33}.no{background:#dc262633}
.po{border:3px solid #1d4ed8;border-radius:16px;overflow:hidden;background:#eaf3ff;color:#17324d}
.ph{background:linear-gradient(120deg,#1d4ed8,#0b7a75);color:#fff;text-align:center;padding:14px 8px}.ph h2{margin:0;font-size:1.3rem}
.pt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}.pt figure{margin:0}.pt img{width:100%;height:110px;object-fit:cover;border-radius:10px;margin:0}.pt figcaption{color:#17324d}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;padding:8px}
.pb{background:#fff;border:2px solid #1d4ed8;border-radius:12px;overflow:hidden}.pn{color:#fff;font-weight:700;padding:6px 10px;display:flex;align-items:center;gap:8px}.pn i{background:#fff;color:#17324d;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-style:normal}
.pb ul{margin:6px 0;padding-left:20px;font-size:.88rem;line-height:1.45}.pf{background:#1d4ed8;color:#fde047;text-align:center;padding:10px;font-weight:700}.pf b{color:#fff}.pc{font-size:.75rem;text-align:center;padding:4px;color:#17324d}
@media print{header,nav,.btn,.sec:not(#info){display:none!important}}

S('intro','1. Introduction (basic → advanced)','🧬','#0b7a75','#2563eb',`
<h3>Basic</h3><p>Polycystic kidney disease (PKD) is an <b>inherited</b> disorder in which fluid-filled cysts progressively replace normal kidney tissue, enlarging the kidneys and eventually causing kidney failure.</p>
<div class="g"><div class="k" style="background:#0b7a75"><b>1:400–1000</b>ADPKD live births</div><div class="k" style="background:#2563eb"><b>~5%</b>of ESKD in the USA (10% of those &lt;60 y)</div><div class="k" style="background:#7c3aed"><b>1:20,000</b>ARPKD live births</div></div>
<h3>Types</h3><p><span class="pill">ADPKD – autosomal dominant (adult)</span><span class="pill">ARPKD – autosomal recessive (child)</span><span class="pill">TSC</span><span class="pill">VHL</span><span class="pill">Acquired cystic kidney disease (non-inherited)</span></p>
<h3>Advanced</h3><p>Most cysts arise from <b>primary cilium dysfunction</b> in tubular epithelial cells (a "ciliopathy"). Polycystin-1 and -2 act as a mechanosensor / calcium channel complex. Loss of function lowers intracellular Ca²⁺, raises <b>cAMP</b>, drives Cl⁻-rich fluid secretion (CFTR) and cell proliferation (mTOR, Ras–ERK). ADPKD is <b>systemic</b> (liver, vessels, heart), but its hallmark is massive kidney enlargement.</p>
<table><tr><th>Disease</th><th>Gene</th><th>Chr.</th><th>Protein</th></tr><tr><td>ADPKD</td><td>PKD1</td><td>16p13.3</td><td>Polycystin-1</td></tr><tr><td>ADPKD</td><td>PKD2</td><td>4q21.2 (4q12.2)</td><td>Polycystin-2 (TRPP2)</td></tr><tr><td>ARPKD</td><td>PKHD1</td><td>6p12/6p21.1</td><td>Fibrocystin / polyductin</td></tr><tr><td>TSC</td><td>TSC1 / TSC2</td><td>9q34 / 16p13.3</td><td>Hamartin / Tuberin</td></tr><tr><td>VHL</td><td>VHL</td><td>3p25</td><td>pVHL</td></tr></table>`),
S('etio','2. Etiology','🔬','#7c3aed','#db2777',`
<p>PKD is <b>genetic</b>. Inheritance pattern defines the type:</p>
<h3>ADPKD (autosomal dominant)</h3><ul><li><b>PKD1 ≈ 85%</b> – severe; median ESKD age <b>54 y</b></li><li><b>PKD2 ≈ 15%</b> (up to 27% in autopsy series) – milder; median ESKD age <b>74 y</b></li><li><b>GANAB ≈ 1%</b> – mild, liver cysts predominate</li><li>Contiguous <b>TSC2–PKD1</b> deletion → severe early-onset PKD + tuberous sclerosis (TSC2 lies ~50 bp from PKD1)</li></ul>
<h3>ARPKD (autosomal recessive)</h3><p><b>PKHD1</b> mutations (fibrocystin). Truncating homozygous mutations → most severe, ↑ perinatal mortality. Mutations are unique to each pedigree; modifier genes cause variable severity.</p>
<h3>Other</h3><p>TSC (mTOR over-activation), VHL (HIF stabilisation), and <b>acquired</b> cystic disease in long-term dialysis (not genetic).</p>`),
S('risk','3. Risk Factors (for inheritance &amp; progression)','⚠️','#f59e0b','#ef4444',`
<h3>For having disease</h3><ul><li>Family history – 50% risk to each child of an affected parent (ADPKD)</li><li>ARPKD: both parents carriers → 25% per pregnancy</li><li>~10% ADPKD are de novo</li></ul>
<h3>For faster progression to ESKD</h3><div class="g"><div class="k" style="background:#ef4444">PKD1 genotype</div><div class="k" style="background:#f59e0b">Male sex</div><div class="k" style="background:#7c3aed">Early-onset hypertension</div><div class="k" style="background:#2563eb">Proteinuria / hematuria</div><div class="k" style="background:#0b7a75">Large total kidney volume (strongest predictor)</div><div class="k" style="background:#db2777">Pregnancies / estrogen (liver cysts)</div></div>
<p><b>Mayo imaging class</b>: HtTKV &gt;600 mL/m, age, sex &amp; creatinine → classes 1A–1E; 1C–1E = rapid progressors.</p>`),
S('path','4. Pathology &amp; Genetics – Flow Chart','🧩','#2563eb','#0b7a75',`
<div class="fl">
<div class="row"><div class="fb" style="background:#7c3aed">PKD1 (16p13.3)<br>85%</div><div class="fb" style="background:#db2777">PKD2 (4q21)<br>15%</div><div class="fb" style="background:#f59e0b">GANAB ~1%</div></div><div class="ar">▼</div>
<div class="fb" style="background:#2563eb">Germline (1st-hit) mutation → ↓ polycystin-1 / polycystin-2 function</div><div class="ar">▼</div>
<div class="fb" style="background:#0b7a75">Defective primary cilium mechanosensing → ↓ Ca²⁺ influx</div><div class="ar">▼</div>
<div class="fb" style="background:#16a34a">↑ cAMP (V2 receptor–Gs–adenylate cyclase) + mTOR / Ras–ERK activation</div><div class="ar">▼</div>
<div class="row"><div class="fb" style="background:#7c3aed">Cl⁻-rich fluid secretion via CFTR</div><div class="fb" style="background:#db2777">Epithelial proliferation &amp; matrix change</div></div><div class="ar">▼</div>
<div class="fb" style="background:#f59e0b">Somatic 2nd hit in the normal allele → clonal cell → focal cyst (&lt;5% nephrons)</div><div class="ar">▼</div>
<div class="fb" style="background:#ef4444">Cyst &gt;2 cm detaches from nephron &amp; keeps secreting fluid</div><div class="ar">▼</div>
<div class="fb" style="background:#2563eb">Compression → ischemia → RAAS ↑ → hypertension, fibrosis</div><div class="ar">▼</div>
<div class="fb" style="background:#17324d">↑ Total kidney volume → GFR loss (4–5 mL/min/yr) → ESKD</div></div>
<p><b>Key concept:</b> "two-hit" model – inherited germline mutation + acquired somatic mutation. Same for TSC and VHL (tumour-suppressor genes).</p>`),
S('signs','5. Signs &amp; Symptoms','🩺','#db2777','#7c3aed',`
<div class="g"><div class="k" style="background:#0b7a75"><b>Pain</b>most common; flank / back</div><div class="k" style="background:#ef4444"><b>Hypertension</b>&gt;60% before GFR falls; mean onset 29 y</div><div class="k" style="background:#f59e0b"><b>Hematuria</b>35–50%</div><div class="k" style="background:#2563eb"><b>Polyuria, nocturia</b>early concentrating defect</div></div>
<h3>Complications</h3><ul><li>Cyst haemorrhage, cyst infection (4-week antibiotics, lipid-soluble), UTI</li><li>Nephrolithiasis – 5–10× ↑; uric acid ~50%</li><li>Mild proteinuria (~260 mg/day)</li></ul>
<h3>Extrarenal</h3><ul><li><b>Liver cysts</b> (&gt;80% by age 30; worse in women)</li><li><b>Intracranial aneurysm</b> 9–12% (22–27% if family history); rupture ≈ 40 y</li><li>Mitral valve prolapse (26%), aortic insufficiency (11%), LVH</li><li>Pancreatic cysts, diverticulosis, hernias, seminal-vesicle cysts</li></ul>
<h3>Pregnancy</h3><p>Higher risk of pre-eclampsia &amp; prematurity; high risk if GFR reduced pre-pregnancy.</p>`),
S('dx','6. Diagnosis','🔍','#0b7a75','#7c3aed',`
<h3>Gross pathology</h3><figure><img src="${IMG_A}" alt="Gross ADPKD kidney"><figcaption>Fig 40.2 – Gross ADPKD kidney: massively enlarged, surface and parenchyma studded with cysts of varied size (Rizk, Reddy, Chapman – National Kidney Foundation Primer).</figcaption></figure>
<p>Kidneys may weigh several kg (normal ≈150 g), cysts contain clear, straw or haemorrhagic fluid; normal parenchyma is largely replaced.</p>
<h3>Microscopic findings</h3><ul><li><b>ADPKD:</b> cysts lined by a single layer of flattened to cuboidal epithelium from any nephron segment; interstitial fibrosis, inflammation, tubular atrophy; cysts detach from nephron.</li><li><b>ARPKD:</b> fusiform dilatation of <b>collecting ducts</b> (up to 90% involved), radially arranged, <i>retain</i> connection to the nephron; liver: congenital hepatic fibrosis, Caroli disease.</li><li><b>ACKD:</b> small kidneys, cysts &lt;3 cm, oxalate crystals; papillary RCC risk.</li></ul>
<figure><img src="${IMG_C}" alt="Gross and microscopic ADPKD, ARPKD, MCDK"><figcaption>A: ADPKD – enlarged cystic kidney; cysts lined by flattened epithelium with interstitial fibrosis. B: ARPKD – fusiform collecting-duct dilatation perpendicular to the capsule. C: MCDK – cysts, immature parenchyma, metaplastic cartilage (differential). Source: ResearchGate figure.</figcaption></figure>
<figure><img src="${IMG_D}" alt="ADPKD histology H&E"><figcaption>ADPKD (H&amp;E): large cyst lined by a thin flattened-to-cuboidal epithelium with fibrous, inflamed stroma and nearby atrophic tubules and glomerulus. Source: AASLD Pathology Pearls, Liver Fellow Network.</figcaption></figure>
<div id="histo"></div><h3>Radiological findings</h3><figure><img src="${IMG_B}" alt="CT kidney and liver cysts"><figcaption>Fig 40.3 – CT: bilateral enlarged kidneys and liver cysts in ADPKD.</figcaption></figure>
<ul><li><b>Ultrasound</b> – first line: enlarged echogenic kidneys with multiple cysts.</li><li><b>CT / MRI</b> – when certainty needed (e.g. kidney donor); MRI gives accurate <b>TKV</b>. Ultrasound overestimates TKV by ~11%.</li><li>CT: non-contrast best for stones. MRA (TOF, no gadolinium) for aneurysm screening.</li></ul>
<table><tr><th>Age (family history +)</th><th>Pei criteria (US)</th></tr><tr><td>15–39 y</td><td>≥3 cysts (uni/bilateral)</td></tr><tr><td>40–59 y</td><td>≥2 cysts in each kidney</td></tr><tr><td>≥60 y</td><td>≥4 cysts in each kidney</td></tr></table>
<p>No family history: ≥5 cysts bilaterally by age 30 + compatible phenotype.</p>
<h3>Genetic findings</h3><ul><li>Direct sequencing of <b>PKD1/PKD2</b>: detection up to 86% / 95%.</li><li>Use when imaging equivocal, in young at-risk people (&lt;40 y) or atypical disease; then <b>targeted exon testing</b> of relatives.</li><li>ARPKD: PKHD1 sequencing (detects 42–87%), limited for prenatal counselling.</li><li>Genetic counselling before testing.</li></ul>`),
S('tx','7. Treatment','💊','#16a34a','#0b7a75',`
<table><tr><th>Target</th><th>Therapy</th></tr><tr><td>Cyst growth (cAMP)</td><td><b>Tolvaptan</b> – V2 receptor antagonist. TEMPO 3:4: TKV growth 2.8% vs 5.5%/yr. Side effects: aquaresis, <b>liver enzyme rise</b>.</td></tr><tr><td>Hypertension</td><td><b>ACEi / ARB first line</b>. HALT-PKD: &lt;110/75 in young adults, early disease → slower TKV rise.</td></tr><tr><td>Polycystic liver</td><td>Somatostatin analogues (octreotide, lanreotide); surgery: fenestration, resection, transplant</td></tr><tr><td>Cyst infection</td><td>4 weeks of lipophilic antibiotics (quinolones, TMP-SMX, chloramphenicol)</td></tr><tr><td>Aneurysm &gt;10 mm</td><td>Elective surgical / endovascular repair</td></tr><tr><td>ESKD</td><td>Dialysis or <b>kidney transplant</b> (better survival; native nephrectomy only if infection / size)</td></tr></table>
<p><b>mTOR inhibitors</b> (sirolimus, everolimus) reduced TKV but did not preserve GFR; more adverse events – not recommended for PKD.</p>
<p><b>TSC:</b> everolimus for AML &gt;3 cm. <b>VHL:</b> surveillance, nephron-sparing surgery when RCC ≥3 cm.</p>`),
S('mgmt','8. Management','🏥','#2563eb','#db2777',`
<div class="g"><div class="k" style="background:#0b7a75"><b>💧 Fluids</b>≥3 L/day if CKD early (watch hyponatremia in advanced CKD)</div><div class="k" style="background:#7c3aed"><b>🧂 Salt</b>&lt;2 g/day (sodium excretion correlates with TKV growth)</div><div class="k" style="background:#f59e0b"><b>🩸 BP</b>&lt;130/80; &lt;110/75 in young with preserved GFR</div><div class="k" style="background:#ef4444"><b>🏃 Avoid</b>contact / high-impact exercise</div></div>
<ul><li><b>Monitoring:</b> BP, eGFR, TKV / HtTKV class, urinalysis.</li><li><b>Aneurysm screening</b> (MRA): family history of ICA / haemorrhage, high-risk jobs, pre-elective surgery.</li><li><b>Pain:</b> non-pharmacologic + analgesia; avoid NSAIDs in CKD.</li><li><b>Pre-pregnancy counselling</b>; avoid estrogens with liver cysts.</li><li><b>Dialysis patients:</b> HD and PD are both possible; native kidneys may bleed on anticoagulation; watch for ACKD / RCC (screen high-risk &gt;3 years on dialysis).</li><li><b>Children:</b> yearly BP and urinalysis in at-risk offspring; no routine genetic screening.</li><li><b>Genetic counselling</b> for families.</li></ul>`),
S('concl','9. Conclusion','🏁','#7c3aed','#2563eb',`
<ul><li>PKD = inherited ciliopathy; ADPKD (PKD1 &gt; PKD2) is the commonest inherited kidney disease.</li><li>"Two-hit" mechanism → cAMP-driven cyst growth.</li><li>TKV is the best prognostic marker; GFR stays normal for decades.</li><li>Control BP, salt, fluids; tolvaptan for rapid progressors; transplant for ESKD.</li><li>As a dialysis technologist: expect hypertension, haemorrhage, infection and cardiovascular disease.</li></ul>
<p style="color:var(--mu);font-size:.85rem">Source: Rizk DV, Reddy B, Chapman AB. Polycystic and Other Cystic Kidney Diseases. <i>Primer on Kidney Diseases</i>, NKF, Ch.40. Verify against KDIGO ADPKD guideline, Brenner &amp; Rector's The Kidney, and Danovitch's Handbook.</p>`),
S('info','10. Infographic Poster – Quick Review','🎨','#db2777','#f59e0b',`
<div class="po" id="poster">
<div class="ph"><h2>POLYCYSTIC KIDNEY DISEASE (PKD)</h2><div>Genetics · Pathology · Diagnosis · Treatment · Care</div></div>
<div class="pt"><figure><img src="${IMG_A}" alt=""><figcaption>Gross ADPKD kidney</figcaption></figure><figure><img src="${IMG_D}" alt=""><figcaption>Histology: cyst wall</figcaption></figure><figure><img src="${IMG_B}" alt=""><figcaption>CT: kidney + liver cysts</figcaption></figure></div>
<div class="pg">
<div class="pb"><div class="pn" style="background:#2563eb"><i>1</i>GENETICS</div><ul><li><b>ADPKD</b> 1:400–1000 (AD)</li><li><b>PKD1</b> 16p13.3 · 85% · PC1 · ESKD ~54 y</li><li><b>PKD2</b> 4q21 · 15% · PC2 · ESKD ~74 y</li><li><b>GANAB</b> ~1% · liver cysts</li><li><b>ARPKD</b> PKHD1 6p · fibrocystin · 1:20,000</li></ul></div>
<div class="pb"><div class="pn" style="background:#7c3aed"><i>2</i>PATHOGENESIS</div><ul><li>Germline + somatic <b>2-hit</b></li><li>Cilium defect → ↓Ca²⁺ → <b>↑cAMP</b></li><li>CFTR Cl⁻ secretion, mTOR / Ras–ERK</li><li>Cyst &gt;2 cm detaches, keeps growing</li><li>↑TKV → RAAS → HTN → ESKD</li></ul></div>
<div class="pb"><div class="pn" style="background:#0b7a75"><i>3</i>CLINICAL FEATURES</div><ul><li>Flank pain · hematuria · polyuria</li><li><b>Hypertension</b> &gt;60%</li><li>Stones (uric acid) · cyst infection</li><li><b>Liver cysts</b> &gt;80% by 30 y</li><li><b>Aneurysm</b> 9–12% · MVP</li></ul></div>
<div class="pb"><div class="pn" style="background:#db2777"><i>4</i>DIAGNOSIS</div><ul><li><b>US</b> first line (Pei criteria)</li><li>CT / MRI → TKV, HtTKV &gt;600 mL/m</li><li>Gross: huge cystic kidneys</li><li>Micro: flattened epithelium, fibrosis</li><li>Genetics: PKD1 / PKD2 sequencing</li></ul></div>
<div class="pb"><div class="pn" style="background:#16a34a"><i>5</i>TREATMENT &amp; CARE</div><ul><li>ACEi / ARB · BP &lt;110/75 (young)</li><li><b>Tolvaptan</b> (V2R blocker) – check LFTs</li><li>Water ≥3 L/d · salt &lt;2 g/d</li><li>Aneurysm &gt;10 mm: repair</li><li>ESKD: dialysis / transplant</li></ul></div>
<div class="pb" style="border-color:#dc2626"><div class="pn" style="background:#dc2626"><i>6</i>RED FLAGS</div><ul><li>Fever + flank pain (cyst infection)</li><li>Heavy bleeding / clots</li><li>Sudden severe headache (aneurysm)</li><li>Rapid BP or creatinine rise</li></ul></div>
</div>
<div class="pf">KEY PRINCIPLE: <b>TKV predicts progression</b> + <b>BP &amp; fluid control</b> + <b>family screening &amp; genetic counselling</b></div>
<div class="pc">Source: Rizk, Reddy, Chapman – NKF Primer on Kidney Diseases, Ch. 40. For teaching use.</div>
</div>
<p style="text-align:center"><button class="btn s" onclick="window.print()">🖨 Print / save poster as PDF</button></p>`)];

let db=null,assets=null,sample=null,owner=false,cache={topics:[],books:[]},view='learn',qz=null;
const $=s=>document.querySelector(s),m=$('#m');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SLOTS=[['adpkd','ADPKD cyst wall (H&E)'],['arpkd','ARPKD – dilated collecting ducts'],['chf','Congenital hepatic fibrosis'],['ackd','Acquired cystic disease / RCC']];
cache.histo={};
const gq=q=>'https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q),pq=q=>'https://pmc.ncbi.nlm.nih.gov/search/?term='+encodeURIComponent(q);
function histo(){const el=$('#histo');if(!el)return;el.innerHTML=`<h3>🔬 Histology gallery</h3><div class="g">`+SLOTS.map(([k,l])=>{const x=cache.histo[k];return `<div class="it"><b>${l}</b>${x?`<img src="/_blob/${x.aid}" alt="${l}"><figcaption>${esc(x.cap||'')}</figcaption>`:`<div class="ban" style="height:90px;border-radius:12px;background:linear-gradient(120deg,#db2777,#7c3aed);margin-top:8px"><span>🔬</span></div>`}${owner?`<button class="btn s" onclick="upHisto('${k}')">⬆ ${x?'Replace':'Upload'} image</button>`:''}</div>`}).join('')+`</div><div class="it"><b>🔗 Histology references (open in new tab)</b><br>`+[['ADPKD histology',gq('ADPKD kidney histology cysts H&E')],['ARPKD histology',gq('ARPKD histology collecting duct dilatation')],['Congenital hepatic fibrosis',gq('congenital hepatic fibrosis histology')],['ACKD / RCC',gq('acquired cystic kidney disease RCC histology')],['PMC: ADPKD pathology',pq('ADPKD pathology histology')],['PMC: ARPKD pathology',pq('ARPKD pathology liver kidney')]].map(([a,u])=>`<a class="pill" target="_blank" rel="noopener" href="${u}">${a}</a>`).join('')+`</div>`}

function learn(){m.innerHTML=`<div style="margin-bottom:12px">`+sections.map(s=>`<a class="pill" href="#${s.id}" style="text-decoration:none;color:inherit">${s.e} ${s.t.replace(/^\d+\. /,'')}</a>`).join('')+`</div>`+sections.map(s=>`<section class="sec" id="${s.id}"><div class="ban" style="background:linear-gradient(120deg,${s.c1},${s.c2})"><h2>${s.t}</h2><span>${s.e}</span></div><div class="bd">${s.h}</div></section>`).join('');histo()}
function list(kind){const label=kind==='topics'?'Class Topics':'Books',items=cache[kind];
m.innerHTML=`<h2>${kind==='topics'?'🗂':'📚'} ${label}</h2><p style="color:var(--mu)">Tap an item to open its PPT, PDF and notes.${kind==='topics'?' Use ✏ Quiz to auto-generate a 20-question test.':''}</p>
<div class="it" style="border-left:6px solid var(--pr)"><b>${kind==='topics'?'Polycystic Kidney Disease (this site)':'Add books below'}</b>${kind==='topics'?`<br><button class="btn s" onclick="go('learn')">Open notes</button><button class="btn" onclick="startQuiz('Polycystic kidney disease (ADPKD, ARPKD, genetics, diagnosis, management)')">📝 Quiz</button>`:''}</div>
${items.map(t=>`<div class="it"><b>${esc(t.title)}</b><div style="color:var(--mu);font-size:.9rem">${esc(t.desc)}</div>${(t.files||[]).map(f=>`<a class="pill" target="_blank" href="${f.url?esc(f.url):'/_blob/'+f.id}">📎 ${esc(f.name)}</a>`).join('')}<br>${kind==='topics'?`<button class="btn" onclick="startQuiz(${esc(JSON.stringify(String(t.title+'. '+(t.desc||''))))})">📝 Quiz</button>`:''}${owner?`<button class="btn s" onclick="addFile('${kind}','${t.id}')">⬆ Upload PDF/image</button><button class="btn" onclick="addLink('${kind}','${t.id}')">🔗 Add link</button><button class="btn d" onclick="del('${kind}','${t.id}')">Delete</button>`:''}</div>`).join('')||'<p>No items yet.</p>'}
${owner?`<div class="it"><b>➕ Add ${kind==='topics'?'topic':'book'} (owner only)</b><input id="nt" placeholder="Title"><textarea id="nd" rows="2" placeholder="Short description"></textarea><button class="btn s" onclick="addItem('${kind}')">Add</button></div>`:(db?'':'<p style="color:var(--mu)">Sign in to claude.ai to see uploaded materials.</p>')}`}
async function addItem(k){const t=$('#nt').value.trim();if(!t)return;const id='i'+Date.now();await db.collection(k).doc(id).set({title:t,desc:$('#nd').value.trim(),files:[],ts:Date.now()})}
async function del(k,id){if(confirm('Delete this item?'))await db.collection(k).doc(id).delete()}

const OKX=/\.(png|jpe?g|gif|webp|svg|pdf|mp4|webm|csv|md|json|txt|woff2?|ttf|otf)$/i;
function pick(accept,cb){const i=document.createElement('input');i.type='file';i.accept=accept||'';i.style.cssText='position:fixed;left:-999px;opacity:0';document.body.appendChild(i);i.onchange=async()=>{const f=i.files[0];i.remove();if(!f)return;if(!assets){alert('Upload is not available here. Open the link in Chrome while signed in to claude.ai as the owner.');return}if(!OKX.test(f.name)){alert('This file type cannot be uploaded ('+f.name+'). Convert PPT/DOC to PDF first, or use "Add link" with a Google Drive link.');return}try{const r=await assets.upload(f);await cb(r,f)}catch(e){alert('Upload failed: '+(e&&(e.message||e.code)||e))}};i.click()}
function addFile(k,id){pick('.pdf,.png,.jpg,.jpeg,.gif,.webp,.csv,.md,.txt,.json,.mp4',async(r,f)=>{const it=cache[k].find(x=>x.id===id);await db.collection(k).doc(id).update({files:[...(it.files||[]),{id:r.id,name:f.name}]});alert('Uploaded: '+f.name)})}
async function addLink(k,id){const u=prompt('Paste link (Google Drive / PPT / PDF URL):');if(!u||!/^https?:\/\//i.test(u))return;const n=prompt('Name to show (e.g. PPT – PKD)')||'Link';const it=cache[k].find(x=>x.id===id);await db.collection(k).doc(id).update({files:[...(it.files||[]),{url:u,name:n}]})}
function upHisto(k){pick('image/*',async(r)=>{const cap=prompt('Caption / source credit (e.g. "Own slide, H&E 400x")')||'';await db.collection('histo').doc(k).set({aid:r.id,cap})})}
async function startQuiz(topic){view='quiz';mark();m.innerHTML=`<h2>📝 Quiz</h2><p>⏳ Generating 20 questions on <b>${esc(topic.slice(0,80))}</b>… (needs your consent once)</p>`;
if(!sample){m.innerHTML+='<p>Quiz generator unavailable in this view.</p>';return}
try{const r=await sample.json(`You are an M.Sc. renal science / dialysis technology examiner. Create exactly 20 exam-style questions (mix recall, application, genetics) on: ${topic}. Return ONLY JSON: {"questions":[{"q":"...","options":["A","B","C","D"],"answer":0,"explain":"one line"}]} where answer is the 0-based index of the correct option.`,{modelTier:'default',cache:false});qz={topic,q:(r.questions||r).slice(0,20),mode:'opt',ans:{}};renderQuiz()}catch(e){m.innerHTML=`<h2>📝 Quiz</h2><p>Could not generate (${esc(e.code||e.message)}). <button class="btn" onclick="startQuiz(${esc(JSON.stringify(String(topic)))})">Retry</button></p>`}}
function renderQuiz(){const o=qz.mode==='opt';let sc=Object.keys(qz.ans).filter(i=>qz.ans[i]===qz.q[i].answer).length;
m.innerHTML=`<h2>📝 ${esc(qz.topic.slice(0,60))}</h2><button class="btn ${o?'s':''}" onclick="qz.mode='opt';renderQuiz()">With options</button><button class="btn ${o?'':'s'}" onclick="qz.mode='no';renderQuiz()">Without options</button><button class="btn" onclick="startQuiz(${esc(JSON.stringify(String(qz.topic)))})">🔄 New 20 questions</button>${o?`<p><b>Score: ${sc} / ${Object.keys(qz.ans).length} answered</b></p>`:''}`+
qz.q.map((x,i)=>`<div class="q"><b>${i+1}. ${esc(x.q)}</b>${o?x.options.map((p,j)=>{const a=qz.ans[i],c=a!==undefined?(j===x.answer?'ok':j===a?'no':''):'';return`<label class="${c}"><input type="radio" name="q${i}" style="width:auto" ${a===j?'checked':''} ${a!==undefined?'disabled':''} onchange="qz.ans[${i}]=${j};renderQuiz()"> ${'ABCD'[j]}. ${esc(p)}</label>`}).join('')+(qz.ans[i]!==undefined?`<div style="color:var(--mu);font-size:.9rem">💡 ${esc(x.explain)}</div>`:''):`<details><summary class="pill">Show answer</summary><p><b>${esc(x.options[x.answer])}</b><br>${esc(x.explain)}</p></details>`}</div>`).join('')}
function quizHome(){if(qz)return renderQuiz();m.innerHTML=`<h2>📝 Auto-generated Quiz</h2><p>20 fresh questions every time – with or without options.</p><button class="btn s" onclick="startQuiz('Polycystic kidney disease (ADPKD, ARPKD, genetics, diagnosis, management)')">Start PKD quiz</button><p>For other topics, open <b>Class Topics</b> and press 📝 Quiz.</p>`}
function go(v){view=v;mark();({learn,topics:()=>list('topics'),books:()=>list('books'),quiz:quizHome})[v]();scrollTo(0,0)}
function mark(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view))}
$('#nav').onclick=e=>{if(e.target.dataset.v)go(e.target.dataset.v)};
go('learn');
(async()=>{try{const u=await claude.use('user');owner=u?await u.isOwner():false;db=await claude.use('db');assets=await claude.use('assets');sample=await claude.use('sample');
if(db)db.collection('histo').onSnapshot(s=>{cache.histo={};s.docs.forEach(d=>cache.histo[d.id]=d.data());if(view==='learn')histo()});
for(const k of['topics','books'])if(db)db.collection(k).onSnapshot(s=>{cache[k]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));if(view===k)list(k)});}catch(e){}})();
</script></body></html>
